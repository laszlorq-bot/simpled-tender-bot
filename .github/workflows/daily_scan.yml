name: Simpled Daily Tender Scan

on:
  schedule:
    # Runs every day at 7:00 AM UTC (8:00 AM UK time, 9:00 AM Morocco/Spain)
    - cron: "0 7 * * *"
  workflow_dispatch:
    # Also allows manual trigger from GitHub UI (useful for testing)
    inputs:
      days_back:
        description: "How many days back to scan (default 1)"
        required: false
        default: "1"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tender bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          DAYS_BACK: ${{ github.event.inputs.days_back || '1' }}
        run: python tender_bot.py
