name: Simpled Daily Tender Scan

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "How many days back to scan (default 1)"
        required: false
        default: "1"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create docs folder
        run: mkdir -p docs

      - name: Run tender bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAYS_BACK: ${{ github.event.inputs.days_back || '1' }}
        run: python tender_bot.py

      - name: Publish dashboard
        run: |
          git config user.name "Tender Bot"
          git config user.email "bot@simpled.co.uk"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Update tender dashboard $(date +'%d %b %Y')"
          git push
